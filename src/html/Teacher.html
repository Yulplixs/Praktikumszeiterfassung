<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lehrkräfte – BBS Einbeck</title>
  <link rel="stylesheet" href="../css/globals.css" />
  <link rel="stylesheet" href="../css/style.css" />
</head>
<body>
  <!-- Icon-Sprite (Lucide-Stil) -->
  <svg xmlns="http://www.w3.org/2000/svg" style="display:none">
    <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></symbol>
    <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></symbol>
    <symbol id="i-filter" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M7 12h10"/><path d="M10 18h4"/></symbol>
    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></symbol>
    <symbol id="i-notebook" viewBox="0 0 24 24"><path d="M13.4 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-7.4"/><path d="M2 6h4"/><path d="M2 10h4"/><path d="M2 14h4"/><path d="M2 18h4"/><path d="M21.378 5.626a1 1 0 1 0-3.004-3.004l-5.01 5.012a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506z"/></symbol>
    <symbol id="i-users" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M5 12h14"/><path d="M12 5v14"/></symbol>
    <symbol id="i-info" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></symbol>
    <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M3 6h18"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></symbol>
    <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
    <symbol id="i-chevron-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-chevron-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
    <symbol id="i-chevron-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
  </svg>

  <header class="hauptnavigation">
    <img class="logo" src="../img/bbs-einbeck-logo.svg" alt="BBS Einbeck" />
    <div class="trennlinie"></div>
    <div class="app-name">Praktikumsbetreuung</div>

    <nav class="bereiche">
      <a class="bereich" href="index.html">Zeitbuchungen</a>
      <a class="bereich aktiv" href="Teacher.html">Lehrkräfte</a>
      <a class="bereich" href="classes.html">Klassen</a>
    </nav>

    <button class="benutzer" type="button">
      <span class="initialen">SV</span>
      <span class="benutzer-text">
        <span class="benutzer-name">Schulverwaltung</span>
        <span class="benutzer-schule">BBS Einbeck</span>
      </span>
      <svg class="icon"><use href="#i-chevron-down"/></svg>
    </button>
  </header>


  <main class="arbeitsbereich">

    <section class="seitenkopf">
      <div>
        <h1 class="titel">Lehrkräfte</h1>
        <p class="beschreibung">Lehrkräfte mit Kürzel und ihren Betreuungsstunden im gewählten Schuljahr.</p>
      </div>
    </section>

    <section class="filterleiste">
      <label class="feld feld-zeitraum">
        <span class="feld-label">Schuljahr</span>
        <select class="eingabe" id="filter-schuljahr"></select>
      </label>
      <label class="feld feld-flex">
        <span class="feld-label">Suche</span>
        <input class="eingabe" id="suche" type="search" placeholder="Kürzel oder Name …" />
      </label>
    </section>

    <form class="karte neue-zeitbuchung" id="formular">
      <div class="karte-kopf">
        <div class="karte-titelzeile">
          <h2 class="karte-titel" id="formular-titel">Neue Lehrkraft</h2>
          <span class="status" id="formular-status" role="status">Noch nicht gespeichert</span>
        </div>
        <span class="text-klein">* Pflichtfelder</span>
      </div>

      <div class="formularzeile">
        <label class="feld feld-schueler">
          <span class="feld-label">Kürzel *</span>
          <input class="eingabe" name="code" type="text" maxlength="30" required />
        </label>
        <label class="feld feld-schueler">
          <span class="feld-label">Titel</span>
          <input class="eingabe" name="title" type="text" maxlength="20" placeholder="z. B. Dr." />
        </label>
        <label class="feld feld-flex">
          <span class="feld-label">Vorname</span>
          <input class="eingabe" name="firstname" type="text" maxlength="50" />
        </label>
        <label class="feld feld-flex">
          <span class="feld-label">Nachname</span>
          <input class="eingabe" name="surname" type="text" maxlength="50" />
        </label>
        <button class="button button-primaer button-gross" type="submit">
          <svg class="icon"><use href="#i-plus"/></svg>
          <span id="formular-knopf">Lehrkraft anlegen</span>
        </button>
        <button class="button button-sekundaer button-gross" type="button" id="formular-abbrechen" hidden>Abbrechen</button>
      </div>
    </form>

    <section class="karte zeitbuchungen">
      <div class="tabellenkopf">
        <div class="karte-titelzeile">
          <h2 class="karte-titel">Lehrkräfte</h2>
          <span class="anzahl" id="tabelle-anzahl">0</span>
        </div>
      </div>

      <table class="tabelle">
        <thead>
          <tr>
            <th>Kürzel</th>
            <th>Name</th>
            <th class="rechts">Einträge</th>
            <th class="rechts">HJ 1</th>
            <th class="rechts">HJ 2</th>
            <th class="rechts">Schuljahr</th>
            <th class="aktion-spalte"><span class="sr-only">Aktionen</span></th>
          </tr>
        </thead>
        <tbody id="tabelle-zeilen"></tbody>
        <tfoot>
          <tr class="summenzeile">
            <td colspan="3">Summe der Auswahl</td>
            <td class="rechts summe" id="summe-hj1">–</td>
            <td class="rechts summe" id="summe-hj2">–</td>
            <td class="rechts summe" id="summe-jahr">–</td>
            <td></td>
          </tr>
        </tfoot>
      </table>
    </section>

  </main>
  <script src="../js/gemeinsam.js"></script>
  <script src="../js/lehrkraefte.js"></script>
</body>
</html>
